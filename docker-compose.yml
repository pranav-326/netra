services:
  # ----------------------------------------------------------------------------
  # PostgreSQL: Structured Metadata, IOC Registry, User Data & Audit Trails
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: netra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netra_db}
      POSTGRES_USER: ${POSTGRES_USER:-netra_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netra_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - netra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netra_admin} -d ${POSTGRES_DB:-netra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis: In-memory Caching, Celery/Task Broker & Event Pub/Sub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: netra-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - netra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # OpenSearch: Forensic Logs, Email Body Indexing & Fast Search
  # ----------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: netra-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=netra-cluster
      - node.name=netra-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - netra-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # Neo4j: Graph Database for Attack Infrastructure & Campaign Relationships
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.20.0-community
    container_name: netra-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-netra_secret_graph_2026}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Web Browser / HTTP API
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - netra-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # SeaweedFS: S3-Compatible Object Store for Raw EML, Attachments & Evidence
  # ----------------------------------------------------------------------------
  # Pinned to an exact release: MinIO's images vanished from Docker Hub, and an
  # unpinned `latest` is how that broke fresh installs.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: netra-seaweedfs
    restart: unless-stopped
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - SEAWEEDFS_ADMIN_PASSWORD=${SEAWEEDFS_ADMIN_PASSWORD:-}
    # With no identity configured SeaweedFS allows anonymous access to everything,
    # and with no password its admin UI is open. Refuse to start in either case.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}"
        : "$${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}"
        : "$${SEAWEEDFS_ADMIN_PASSWORD:?set SEAWEEDFS_ADMIN_PASSWORD in .env}"
        printf '{"identities":[{"name":"netra","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec /entrypoint.sh mini -dir=/data -s3.config=/tmp/s3.json \
          -admin.password="$$SEAWEEDFS_ADMIN_PASSWORD" \
          -filer.disableDirListing -s3.port.iceberg=0 -s3.port.lance=0
    ports:
      - "8333:8333"   # S3 API (credentials required)
      - "23646:23646" # Admin UI (password required)
    volumes:
      - seaweedfs_data:/data
    networks:
      - netra-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ----------------------------------------------------------------------------
  # Layer 1: Email Ingestion Service (FastAPI)
  # ----------------------------------------------------------------------------
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: netra-ingestion
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=seaweedfs:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_SECURE=false
      # No default: the service refuses to start without a signing secret.
      - NETRA_AUTH_SECRET=${NETRA_AUTH_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - netra-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Layer 2: Preprocessing & Parser Service (Python Worker)
  # ----------------------------------------------------------------------------
  parser:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    container_name: netra-parser
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=seaweedfs:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_SECURE=false
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - netra-network

  # ----------------------------------------------------------------------------
  # Layer 3: Security Analysis Engines (Python Worker)
  # ----------------------------------------------------------------------------
  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    container_name: netra-analyzer
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      parser:
        condition: service_started
    networks:
      - netra-network

  # ----------------------------------------------------------------------------
  # Layer 4: Threat Engine & Classification (Python Worker)
  # ----------------------------------------------------------------------------
  threat_engine:
    build:
      context: .
      dockerfile: services/threat_engine/Dockerfile
    container_name: netra-threat-engine
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      analyzer:
        condition: service_started
    networks:
      - netra-network

  # ----------------------------------------------------------------------------
  # Layer 5: Threat Intelligence Enrichment (Python Worker)
  # ----------------------------------------------------------------------------
  threat_intel:
    build:
      context: .
      dockerfile: services/threat_intel/Dockerfile
    container_name: netra-threat-intel
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - ABUSEIPDB_ENABLED=${ABUSEIPDB_ENABLED:-true}
      - ABUSEIPDB_MALICIOUS_THRESHOLD=${ABUSEIPDB_MALICIOUS_THRESHOLD:-50}
      - ABUSEIPDB_CACHE_TTL_SECONDS=${ABUSEIPDB_CACHE_TTL_SECONDS:-21600}
    depends_on:
      redis:
        condition: service_healthy
      threat_engine:
        condition: service_started
    networks:
      - netra-network

  # ----------------------------------------------------------------------------
  # Layer 6: Graph Correlation & Campaign Detection (Python Worker)
  # ----------------------------------------------------------------------------
  correlation:
    build:
      context: .
      dockerfile: services/correlation/Dockerfile
    container_name: netra-correlation
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_HOST=neo4j
      - NEO4J_BOLT_PORT=7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-netra_secret_graph_2026}
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      threat_intel:
        condition: service_started
    networks:
      - netra-network

  # ----------------------------------------------------------------------------
  # Layers 7 & 9: API Gateway & PostgreSQL Persistence (FastAPI)
  # ----------------------------------------------------------------------------
  api_gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: netra-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-netra_db}
      - POSTGRES_USER=${POSTGRES_USER:-netra_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-netra_secure_password_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_HOST=neo4j
      - NEO4J_BOLT_PORT=7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-netra_secret_graph_2026}
      # No default: the service refuses to start without a signing secret.
      - NETRA_AUTH_SECRET=${NETRA_AUTH_SECRET:-}
      - NETRA_TOKEN_TTL_SECONDS=${NETRA_TOKEN_TTL_SECONDS:-28800}
      # Accounts created on first start, when no user exists yet.
      - NETRA_ADMIN_USERNAME=${NETRA_ADMIN_USERNAME:-admin}
      - NETRA_ADMIN_PASSWORD=${NETRA_ADMIN_PASSWORD:-}
      - NETRA_ANALYST_USERNAME=${NETRA_ANALYST_USERNAME:-analyst}
      - NETRA_ANALYST_PASSWORD=${NETRA_ANALYST_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      correlation:
        condition: service_started
    networks:
      - netra-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Makeshift Testing UI: Streamlit Interactive Dashboard
  # ----------------------------------------------------------------------------
  streamlit_ui:
    build:
      context: ./frontend_test
      dockerfile: Dockerfile
    container_name: netra-streamlit-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - INGESTION_URL=http://ingestion:8000
      - API_GATEWAY_URL=http://api_gateway:8080
      # The console signs in as this account (analyst by default).
      - NETRA_CONSOLE_USERNAME=${NETRA_ANALYST_USERNAME:-analyst}
      - NETRA_CONSOLE_PASSWORD=${NETRA_ANALYST_PASSWORD:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    depends_on:
      ingestion:
        condition: service_healthy
      api_gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netra-network

  # ----------------------------------------------------------------------------
  # Netra Next.js Production Web UI (नेTRA SIH26106)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netra-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_INGESTION_URL=http://localhost:8000
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8080
    depends_on:
      ingestion:
        condition: service_healthy
      api_gateway:
        condition: service_healthy
    networks:
      - netra-network


# ==============================================================================
# Isolated Virtual Networks
# ==============================================================================
networks:
  netra-network:
    name: netra-network
    driver: bridge

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: netra_postgres_data
  redis_data:
    name: netra_redis_data
  opensearch_data:
    name: netra_opensearch_data
  neo4j_data:
    name: netra_neo4j_data
  neo4j_logs:
    name: netra_neo4j_logs
  seaweedfs_data:
    name: netra_seaweedfs_data
